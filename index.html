<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maitre de Diamant</title>
<style>
:root{--ink:#14110d;--ivory:#faf6ee;--card:#fffdf8;--gold:#b08d4a;--gold2:#d8bd7e;--muted:#6f675b;--line:#e8dfcd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,.brand,.serif{font-family:"Cormorant Garamond","Didot","Bodoni 72",Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:.02em}
.top{background:var(--ink);color:var(--ivory);text-align:center;padding:22px 16px 18px;border-bottom:3px solid var(--gold)}
.top .brand{font-size:28px;color:var(--gold2)}
.top .tag{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#cfc6b4;margin-top:4px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
#login{max-width:380px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:28px 24px;border-radius:6px;box-shadow:0 8px 30px rgba(20,17,13,.06)}
#login h2{margin:0 0 4px;font-size:26px;text-align:center}
#login p.sub{margin:0 0 20px;text-align:center;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,74,.18)}
button{margin-top:20px;width:100%;padding:12px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--gold2);border:1px solid var(--ink);border-radius:4px;cursor:pointer}
button:hover{background:#2a241b}
button.link{width:auto;margin:0;padding:6px 12px;font-size:11px;background:transparent;color:var(--muted);border:1px solid var(--line)}
#err{color:#9b2c2c;font-size:14px;text-align:center;min-height:20px;margin-top:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:34px;line-height:1.15}
.head .sub{color:var(--muted);margin-top:4px}
.head .sub b{color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .v{font-family:"Cormorant Garamond","Didot",Georgia,serif;font-size:26px;margin-top:2px}
.card.hl{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.card.hl .k{color:#cfc6b4}.card.hl .v{color:var(--gold2)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:24px}
.person{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:12px 16px}
.person h3{margin:0 0 6px;font-family:"Cormorant Garamond","Didot",Georgia,serif;font-weight:600;font-size:20px}
.person dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:0;font-size:14px}
.person dt{color:var(--muted)}.person dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
h2.sec{font-size:24px;margin:8px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:14px}
th{background:var(--ink);color:var(--gold2);font-weight:500;text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#fbf8f1}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.d{white-space:nowrap}
.sku{font-weight:600;letter-spacing:.03em}
.desc{color:var(--muted);font-size:13px}
.who{display:inline-block;padding:2px 8px;border:1px solid var(--gold);border-radius:20px;font-size:12px;white-space:nowrap}
.st{font-size:12px;white-space:nowrap}
a{color:#8a6a2c}
button.doc{display:block;width:100%;margin:0 0 5px;padding:5px 9px;font-size:10px;letter-spacing:.1em;background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:3px;white-space:nowrap}
button.doc:hover{background:var(--ink);color:var(--gold2)}
td.docs{white-space:nowrap;width:1%}
td.piece{min-width:230px}
.foot{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
.cardsrow{display:none}
@media (max-width:720px){
 .head h1{font-size:27px}
 table{min-width:0}
 thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 tr{border-top:1px solid var(--line);padding:8px 4px}
 tr:nth-child(even) td{background:transparent}
 td{border:0;padding:3px 10px;display:flex;justify-content:space-between;gap:12px;text-align:right}
 td::before{content:attr(data-l);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;flex:0 0 auto}
 td.piece{display:block;text-align:left}
 td.piece::before{display:block}
 td.n{text-align:right}
 td.piece{min-width:0}
 td.docs{width:100%;white-space:normal;flex-wrap:wrap;justify-content:flex-end;align-items:center}
 td.docs::before{margin-right:auto}
 td.docs button.doc{display:inline-block;width:auto;margin:2px 0 2px 6px;padding:7px 12px}
}

.pc{display:flex;gap:12px;align-items:flex-start}
.pc .tx{min-width:0}
button.ph,span.ph{flex:0 0 64px;width:64px;height:64px;margin:0;padding:0;border:1px solid var(--line);border-radius:5px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in;letter-spacing:0;text-transform:none}
button.ph:hover{background:#fff;border-color:var(--gold)}
button.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
button.ph img.on{opacity:1}
span.ph.none{cursor:default;background:linear-gradient(145deg,#fbf8f1,#f1e9d8)}
span.ph.none b{font-family:"Cormorant Garamond","Didot",Georgia,serif;font-weight:500;font-size:19px;color:var(--gold);letter-spacing:.04em}
span.ph.none b i{font-size:13px;font-style:italic;color:#8a6a2c;margin:0 1px}
#lb{position:fixed;inset:0;background:rgba(20,17,13,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:6px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#lb span{color:var(--gold2);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.vip{background:var(--ink);color:var(--ivory);border:1px solid var(--gold);border-radius:8px;padding:12px 18px 11px;min-width:230px;text-align:center;position:relative;overflow:hidden}
.vip .vk{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#cfc6b4}
.vip .vt{font-family:"Cormorant Garamond","Didot",Georgia,serif;font-size:30px;line-height:1.1;margin:2px 0 1px;letter-spacing:.06em}
.vip .vs{font-size:12px;color:#e9e1cf;font-variant-numeric:tabular-nums}
.vip .vn{font-size:11px;color:#b9ae98;margin-top:4px;font-style:italic}
.vip-member .vt{color:#efe8da}
.vip-silver{border-color:#c9ccd1}.vip-silver .vt{background:linear-gradient(90deg,#9ea3aa,#f4f5f7,#9ea3aa);-webkit-background-clip:text;background-clip:text;color:transparent}
.vip-gold .vt{background:linear-gradient(90deg,#b08d4a,#f3dc9c,#b08d4a);-webkit-background-clip:text;background-clip:text;color:transparent}
.vip-platinum{border-color:#dfe3ea}.vip-platinum .vt{background:linear-gradient(90deg,#c9ced6,#ffffff,#aeb6c2);-webkit-background-clip:text;background-clip:text;color:transparent}
.vip-diamond{border-color:#e9eef7;background:radial-gradient(120% 140% at 50% 0%,#2b2a33 0%,#14110d 70%)}
.vip-diamond .vt{background:linear-gradient(100deg,#d8e6ff 0%,#ffffff 25%,#f6d9ff 45%,#ffffff 60%,#d8f3ff 80%,#ffffff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:mddShine 5s linear infinite}
.vip-diamond::after{content:"\2726";position:absolute;top:7px;right:11px;color:#fff;font-size:11px;opacity:.85;animation:mddTw 2.4s ease-in-out infinite}
.vip-diamond::before{content:"\2727";position:absolute;bottom:8px;left:12px;color:#dfe9ff;font-size:9px;opacity:.6;animation:mddTw 3.1s ease-in-out infinite .8s}
@keyframes mddShine{to{background-position:-220% 0}}
@keyframes mddTw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.tier{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);background:var(--ink);color:var(--gold2);white-space:nowrap}
.tier.t-member{background:transparent;color:var(--muted);border-color:var(--line)}
.tier.t-silver{color:#e3e6ea;border-color:#c9ccd1}.tier.t-platinum{color:#fff;border-color:#dfe3ea}
.tier.t-diamond{color:#fff;border-color:#e9eef7;background:linear-gradient(120deg,#14110d,#3a3646,#14110d)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 14px}
.tabs button{width:auto;margin:0;padding:8px 14px;font-size:11px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.adm-sec{display:none;margin-top:6px;padding-top:18px;border-top:2px solid var(--gold)}.adm-sec.on{display:block}
.adm-sec .head button.link,.adm-sec .head h1{display:none}
.adm-sec .head .sub{font-size:18px}
.wrap{max-width:1440px}
td{padding:10px 8px}th{padding:10px 8px}
.adm table{min-width:980px}
.adm tbody tr{cursor:pointer}
.adm tbody tr:hover td{background:#f6efe0}
@media (max-width:720px){
 .vip{width:100%}
 button.ph,span.ph{flex-basis:76px;width:76px;height:76px}
 td.piece .pc{margin-top:4px}
 .adm table{min-width:0}
}
</style></head>
<body>
<header class="top"><div class="brand">Maitre de Diamant</div><div class="tag">Private client purchases</div></header>
<main class="wrap">
<div id="app"><form id="login" autocomplete="on" onsubmit="return doLogin(event)">
<h2>Maitre de Diamant</h2><p class="sub">Please sign in to view your purchases.</p>
<label for="u">Username</label><input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<button type="submit" id="go">Sign in</button><div id="err" role="alert"></div>
</form></div>
</main>
